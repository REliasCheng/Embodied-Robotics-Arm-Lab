name: Robotics offline control
on:
  push:
    branches: [main]
  pull_request:
jobs:
  offline:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
        python: ['3.10', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install isolated offline package and tools
        run: python -m pip install -e . pytest==8.3.5 build==1.2.2.post1 ruff==0.11.13 mypy==1.15.0
      - name: Tests
        run: python -m pytest -q
      - name: Lint
        run: python -m ruff check offline_control tests_offline
      - name: Types
        run: python -m mypy offline_control
      - name: Build wheel and sdist
        run: python -m build
      - name: Install built wheel
        shell: bash
        run: python -m pip install --force-reinstall dist/*.whl
      - name: Five installed CLI scenarios
        shell: bash
        run: |
          for scenario in normal invalid-input transport-fault recovery replay; do
            robotics-offline --scenario "$scenario" --config third_party/genkiarm/lerobot/configs/robot/so100.yaml
          done
