name: Robotics mock tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  original-class-mocks:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python 3.10
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.10"

      - name: Install CPU-only test dependencies
        run: |
          python -m pip install "torch==2.11.0+cpu" --index-url https://download.pytorch.org/whl/cpu
          python -m pip install "numpy==2.2.6" "hydra-core==1.3.2" "omegaconf==2.3.0" "tqdm>=4.66,<5" "pyserial==3.5"

      - name: Exercise original classes with mocked hardware
        env:
          PYTHONPATH: third_party/genkiarm
        run: python -m unittest discover -s tests -p 'test_robotics_*.py' -v
